models:
  - name: 01__extract_distinct_policy_ids
    description: >
      Extract distinct policy IDs from the source data.
    columns:
      - name: sb_policy_key
        description: >
          Unique identifier for the policy, combining company, symbol, number, module number, and effective date.
        data_tests: 
          - not_null
          - unique
      - name: company_numb
        description: >
          The company number associated with the policy. Should be 1, 3, 4, 5, or 7.
        data_tests: 
          - not_null
          - accepted_values:
              values: [1, 3, 4, 5, 7]
      - name: policy_sym
        description: >
          The policy symbol, which should be from 1-character to 3-character string.
        data_tests:
          - not_null
          - assert_string_matches_regex:
              regex: "{{ var('policy_sym_regex') }}"
      - name: policy_numb
        description: >
          The policy number, which should be at most 7 digits.
        data_tests:
          - not_null
          - assert_min_value_ge:
              min_value: 0
          - assert_max_value_lt:
              max_value: 10000000
      - name: policy_module
        description: >
          The policy module number, which should be at most 3 digits.
        data_tests:
          - not_null
          - assert_min_value_ge:
              min_value: 0
          - assert_max_value_lt:
              max_value: 1000
      - name: policy_eff_date
        description: >
          The effective date of the policy.
        data_tests:
          - not_null